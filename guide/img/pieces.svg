<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a9490"/>
    </marker>
    <style>
      .box { fill: #fff; stroke: #e0dbcf; stroke-width: 1.5; }
      .t { font-size: 17px; font-weight: 700; fill: #1c2321; }
      .s { font-size: 13px; fill: #5d6763; }
      .l { stroke: #8a9490; stroke-width: 1.8; fill: none; marker-end: url(#a); }
      .lab { font-size: 12px; fill: #5d6763; font-style: italic; }
    </style>
  </defs>
  <rect width="720" height="470" rx="18" fill="#f6f4ef"/>

  <!-- You -->
  <rect x="24" y="186" width="150" height="98" rx="14" fill="#1f5f5b"/>
  <text x="99" y="226" text-anchor="middle" font-size="19" font-weight="700" fill="#fff">You</text>
  <text x="99" y="249" text-anchor="middle" font-size="13" fill="#d5e6e3">set goals,</text>
  <text x="99" y="266" text-anchor="middle" font-size="13" fill="#d5e6e3">confirm facts</text>

  <!-- Agent -->
  <rect class="box" x="236" y="40" width="200" height="92" rx="14"/>
  <text class="t" x="336" y="76" text-anchor="middle">Your agent</text>
  <text class="s" x="336" y="98" text-anchor="middle">interviews you, builds</text>
  <text class="s" x="336" y="115" text-anchor="middle">and sets everything up</text>

  <!-- Assistant -->
  <rect class="box" x="236" y="338" width="200" height="92" rx="14"/>
  <text class="t" x="336" y="374" text-anchor="middle">Your chat assistant</text>
  <text class="s" x="336" y="396" text-anchor="middle">"today I did X":</text>
  <text class="s" x="336" y="413" text-anchor="middle">keeps the sheet current</text>

  <!-- Drive -->
  <rect x="262" y="180" width="148" height="110" rx="14" fill="#e3efed" stroke="#1f5f5b" stroke-width="1.8"/>
  <text class="t" x="336" y="215" text-anchor="middle">Google Drive</text>
  <rect x="300" y="228" width="72" height="44" rx="5" fill="#fff" stroke="#1f5f5b" stroke-width="1.2"/>
  <path d="M300 242h72M300 257h72M324 228v44M348 228v44" stroke="#9cc3bd" stroke-width="1"/>
  <text x="336" y="285" text-anchor="middle" font-size="11.5" fill="#1f5f5b" font-weight="700">ONE SPREADSHEET</text>

  <!-- Outputs -->
  <rect class="box" x="496" y="60" width="204" height="96" rx="14"/>
  <text class="t" x="598" y="96" text-anchor="middle">Private dashboard</text>
  <text class="s" x="598" y="118" text-anchor="middle">roadmap + pages,</text>
  <text class="s" x="598" y="135" text-anchor="middle">behind a login</text>
  <rect class="box" x="496" y="187" width="204" height="96" rx="14"/>
  <text class="t" x="598" y="223" text-anchor="middle">Public page</text>
  <text class="s" x="598" y="245" text-anchor="middle">optional, like</text>
  <text class="s" x="598" y="262" text-anchor="middle">a portfolio</text>
  <rect class="box" x="496" y="314" width="204" height="96" rx="14"/>
  <text class="t" x="598" y="350" text-anchor="middle">CV (PDF)</text>
  <text class="s" x="598" y="372" text-anchor="middle">optional, same data</text>
  <text class="s" x="598" y="389" text-anchor="middle">as the public page</text>

  <!-- Lines -->
  <path class="l" d="M140 186 C150 120 190 92 232 88"/>
  <text class="lab" x="118" y="128">talk</text>
  <path class="l" d="M140 284 C150 350 190 380 232 384"/>
  <text class="lab" x="116" y="352">chat</text>
  <path class="l" d="M336 132 V176"/>
  <text class="lab" x="344" y="160">sets up</text>
  <path class="l" d="M336 338 V294"/>
  <text class="lab" x="344" y="322">updates</text>
  <path class="l" d="M410 220 C440 200 460 120 492 108"/>
  <path class="l" d="M410 235 H492"/>
  <path class="l" d="M410 250 C440 270 460 350 492 362"/>
  <text class="lab" x="430" y="222">builds</text>
</svg>
